<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Independent Document Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
<script>if (typeof pdfjsLib === "undefined") { document.write('<script src="../assets/js/pdf.min.js"><\/script>'); }</script>
<style>
:root {
    color-scheme: light;
    --toolbar-height: 44px;
    --toolbar-bg: #fbfbfb;
    --toolbar-line: #d9d9d9;
    --icon: #87919a;
    --viewer-bg: #f1f1f1;
    --active-bg: #e4eaf3;
    --active-line: #c8d5e6;
    --ui-font: Arial, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--viewer-bg);
    color: #343a40;
    font-family: var(--ui-font);
}
button { font: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible {
    outline: 2px solid #6c9bd2;
    outline-offset: 1px;
}
#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--viewer-bg);
}
#toolbar {
    position: absolute;
    z-index: 30;
    inset: 0 0 auto;
    height: var(--toolbar-height);
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 8px;
    border-bottom: 1px solid var(--toolbar-line);
    background: var(--toolbar-bg);
    color: var(--icon);
}
.tool-btn {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    color: var(--icon);
    cursor: pointer;
}
.tool-btn:hover,
.tool-btn[aria-pressed="true"],
.tool-btn[aria-expanded="true"] {
    background: #e7edf5;
    border-color: #dce4ee;
}
.tool-btn svg {
    display: block;
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.separator {
    flex: 0 0 auto;
    width: 1px;
    height: 20px;
    margin: 0 5px;
    background: #d4d8dc;
}
.toolbar-spacer { flex: 1 1 auto; min-width: 8px; }
.zoom-group {
    display: flex;
    align-items: center;
    gap: 1px;
    height: 32px;
    padding: 0 3px;
    border-radius: 4px;
    background: #f0f2f4;
}
.zoom-select {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 62px;
    height: 30px;
    padding: 0 5px;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    color: #3d4750;
    font-size: 14px;
    font-style: italic;
    font-weight: 600;
    cursor: pointer;
}
.zoom-select svg { width: 12px; height: 12px; stroke-width: 2; }
.zoom-step { width: 32px; height: 32px; }
.zoom-step svg { width: 23px; height: 23px; }

#viewerArea {
    position: absolute;
    inset: var(--toolbar-height) 0 0;
    overflow: auto;
    background: var(--viewer-bg);
    scrollbar-width: auto;
    scrollbar-color: #b7bec6 #f1f3f5;
    overscroll-behavior: contain;
}
#viewerArea::-webkit-scrollbar { width: 12px; height: 12px; }
#viewerArea::-webkit-scrollbar-track {
    background: #f1f3f5;
    border-left: 1px solid #e0e3e6;
}
#viewerArea::-webkit-scrollbar-thumb {
    background: #b7bec6;
    border: 2px solid #f1f3f5;
    border-radius: 6px;
}
#viewerArea::-webkit-scrollbar-thumb:hover { background: #a7afb8; }
#app.sidebar-open #viewerArea { left: 210px; }

/* min-height:0 (not 100%) so the stage equals real content height;
   the parent container then hugs the certificate with no grey band. */
#pageStage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    width: 100%;
    min-height: 0;
    padding: 10px 12px 7px;
    text-align: center;
}
#pageStage.layout-double {
    display: grid;
    grid-template-columns: repeat(2, max-content);
    justify-content: center;
    align-content: start;
    align-items: start;
    column-gap: 16px;
    row-gap: 12px;
}
#pageStage.layout-cover {
    display: grid;
    grid-template-columns: repeat(2, max-content);
    justify-content: center;
    align-content: start;
    align-items: start;
    column-gap: 16px;
    row-gap: 12px;
}
#pageStage.layout-cover .pdf-page-shell[data-page="1"] {
    grid-column: 1 / -1;
}
.pdf-page-shell {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: max-content;
    max-width: 100%;
    margin: 0 auto;
}
.pdf-page {
    display: block;
    flex: 0 0 auto;
    background: #fff;
    border: 1px solid #e1e3e6;
    box-shadow: 0 0 4px rgba(0,0,0,.14);
}
.page-number {
    display: none;
    margin-top: 4px;
    color: #626b73;
    font-size: 11px;
}
#pageStage.layout-double .page-number,
#pageStage.layout-cover .page-number { display: block; }
#loading, #error {
    margin: 18px auto;
    padding: 10px 14px;
    border: 1px solid #d6dadd;
    background: #fff;
    color: #5b6268;
    font-size: 13px;
    line-height: 1.45;
}
#error { max-width: 640px; color: #8a2222; white-space: normal; }

/* Sidebar / page thumbnails */
#sidebar {
    position: absolute;
    z-index: 20;
    top: var(--toolbar-height);
    bottom: 0;
    left: 0;
    width: 210px;
    overflow: auto;
    padding: 12px 10px 18px;
    border-right: 1px solid #cbd0d5;
    background: #f8f9fa;
    box-shadow: 2px 0 5px rgba(0,0,0,.05);
}
#sidebar[hidden], .popup[hidden] { display: none !important; }
.sidebar-heading {
    margin: 0 0 12px;
    color: #59636c;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
}
#thumbnailList { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.thumb-size-panel {
    margin: 0 0 10px;
    padding: 5px 4px 8px;
    border-bottom: 1px solid #e0e3e6;
}
.thumb-reset {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 30px;
    margin: 0 0 7px;
    border: 1px solid #dfe3e8;
    border-radius: 3px;
    background: #eef1f4;
    color: #75818c;
    cursor: pointer;
}
.thumb-reset:hover { background: #e3e8ef; }
.thumb-reset svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.thumb-size-controls {
    display: flex;
    align-items: center;
    gap: 5px;
}
.thumb-size-step {
    flex: 0 0 20px;
    width: 20px;
    height: 22px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #737e88;
    font-size: 19px;
    line-height: 20px;
    cursor: pointer;
}
#thumbSizeRange {
    min-width: 0;
    width: 100%;
    height: 18px;
    accent-color: #5d83b1;
    cursor: pointer;
}
.thumb-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    width: 100%;
    padding: 7px 4px;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    color: #5b6268;
    cursor: pointer;
}
.thumb-item:hover { background: #eef1f4; }
.thumb-item[aria-current="page"] {
    border-color: #b7c9df;
    background: #e7eef7;
}
.thumb-canvas {
    display: block;
    max-width: 86px;
    background: #fff;
    border: 1px solid #cfd4d9;
    box-shadow: 0 0 2px rgba(0,0,0,.12);
}
.thumb-label { font-size: 12px; }

/* Toolbar popup menus */
.popup {
    position: absolute;
    z-index: 40;
    top: calc(var(--toolbar-height) + 4px);
    width: 250px;
    max-width: calc(100vw - 12px);
    padding: 7px;
    border: 1px solid #cfd4d8;
    border-radius: 4px;
    background: #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.16);
    color: #3f4850;
    text-align: left;
}
#pageMenu { left: 78px; }
#zoomMenu { left: 145px; width: 160px; }
#settingsMenu { right: 8px; width: 175px; }
.menu-section-title {
    margin: 6px 8px 4px;
    color: #737c84;
    font-size: 12px;
    font-weight: 600;
}
.menu-divider { height: 1px; margin: 7px 2px; background: #e0e3e6; }
.menu-option {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 34px;
    padding: 7px 9px;
    border: 0;
    border-radius: 3px;
    background: #fff;
    color: #414a52;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
}
.menu-option:hover { background: #eef1f4; }
.menu-option[aria-pressed="true"] { background: #e3eaf4; }
.menu-option:disabled { opacity: .42; cursor: not-allowed; }
.menu-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    min-width: 22px;
    height: 22px;
    color: #71808c;
}
.menu-icon svg {
    display: block;
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
#app.pan-mode #pageStage { cursor: grab; user-select: none; }
#app.pan-mode.is-dragging #pageStage { cursor: grabbing; }

#nativeFallback {
    display: none;
    position: absolute;
    z-index: 10;
    inset: var(--toolbar-height) 0 0;
    width: 100%;
    height: calc(100% - var(--toolbar-height));
    border: 0;
    background: var(--viewer-bg);
}
#app.native-mode #nativeFallback {
    display: block;
    inset: 0;
    height: 100%;
}
#app.native-mode #toolbar,
#app.native-mode #sidebar,
#app.native-mode .popup,
#app.native-mode #viewerArea { display: none !important; }
#fallbackNote {
    display: none;
    position: absolute;
    z-index: 50;
    right: 8px;
    bottom: 8px;
    padding: 5px 8px;
    border-radius: 3px;
    background: rgba(255,255,255,.92);
    color: #68727b;
    font-size: 11px;
}
#app.native-mode #fallbackNote { display: block; }

#app:fullscreen { width: 100vw; height: 100vh; background: var(--viewer-bg); }
@media (max-width: 600px) {
    #toolbar { gap: 1px; padding: 0 3px; }
    .tool-btn { width: 29px; }
    .separator { margin: 0 2px; }
    .zoom-group { padding: 0 1px; }
    .zoom-select { min-width: 50px; font-size: 13px; }
    .zoom-step { width: 28px; }
    #sidebar { width: 168px; }
    #app.sidebar-open #viewerArea { left: 168px; }
    #pageMenu { left: 40px; }
    #zoomMenu { left: 98px; }
    .popup { max-height: calc(100% - 50px); overflow: auto; }
    #pageStage { padding-right: 8px; padding-left: 8px; }
    #pageStage.layout-double, #pageStage.layout-cover {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 8px;
    }
    #pageStage.layout-double .pdf-page,
    #pageStage.layout-cover .pdf-page { max-width: 100%; height: auto !important; }
}
@media print {
    #toolbar, #sidebar, .popup, #fallbackNote { display: none !important; }
    html, body, #app, #viewerArea { position: static; height: auto; overflow: visible; background: #fff; }
    #pageStage { display: block; padding: 0; }
    .pdf-page { border: 0; box-shadow: none; page-break-after: always; }
}
</style>
</head>
<body>
<div id="app">
    <div id="toolbar" role="toolbar" aria-label="Document viewer toolbar">
        <button class="tool-btn" id="btnSidebar" type="button" title="Sidebar"
                aria-label="Toggle sidebar" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="4.5" width="17" height="15" rx="1.3"/>
                <line x1="9.5" y1="4.5" x2="9.5" y2="19.5"/>
            </svg>
        </button>
        <span class="separator" aria-hidden="true"></span>
        <button class="tool-btn" id="btnPageOptions" type="button" title="Page settings"
                aria-label="Page settings" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 2.8h8l4 4V12"/>
                <path d="M14 2.8v4h4"/>
                <path d="M6 2.8v18.4h7"/>
                <circle cx="17" cy="17" r="3.1"/>
                <path d="M17 12.9v1M17 20v1M12.9 17H14M20 17h1"/>
                <path d="m14.8 14.8-.7-.7m5.8 5.8-.7-.7m.7-4.4-.7.7m-4.4 4.4-.7.7"/>
            </svg>
        </button>
        <div class="zoom-group" aria-label="Zoom controls">
            <button class="zoom-select" id="zoomSelect" type="button"
                    title="Zoom percentage" aria-expanded="false">
                <span id="zoomLabel">69%</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <button class="tool-btn zoom-step" id="zoomOut" type="button" title="Zoom out" aria-label="Zoom out">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/>
                </svg>
            </button>
            <button class="tool-btn zoom-step" id="zoomIn" type="button" title="Zoom in" aria-label="Zoom in">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="8.5"/><path d="M8 12h8M12 8v8"/>
                </svg>
            </button>
        </div>
        <span class="separator" aria-hidden="true"></span>
        <button class="tool-btn" id="btnPan" type="button" title="Pan" aria-label="Pan tool" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10"/>
                <path d="M10 10V3.5a1.5 1.5 0 0 1 3 0V10"/>
                <path d="M13 10V5a1.5 1.5 0 0 1 3 0v6"/>
                <path d="M16 11V8a1.5 1.5 0 0 1 3 0v6.5a7 7 0 0 1-7 7h-2.2a5 5 0 0 1-3.4-1.3L2.6 16.7a1.5 1.5 0 0 1 2.1-2.1L7 16.4"/>
            </svg>
        </button>
        <span class="toolbar-spacer"></span>
        <button class="tool-btn" id="btnSettings" type="button" title="Settings"
                aria-label="Settings" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19.4 13.1a7.7 7.7 0 0 0 0-2.2l1.6-1.2-1.8-3.1-1.9.8a7.4 7.4 0 0 0-1.9-1.1L15.1 4h-3.6l-.3 2.3a7.4 7.4 0 0 0-1.9 1.1l-1.9-.8-1.8 3.1 1.6 1.2a7.7 7.7 0 0 0 0 2.2l-1.6 1.2 1.8 3.1 1.9-.8a7.4 7.4 0 0 0 1.9 1.1l.3 2.3h3.6l.3-2.3a7.4 7.4 0 0 0 1.9-1.1l1.9.8 1.8-3.1z"/>
                <circle cx="13.3" cy="12" r="2.6"/>
            </svg>
        </button>
    </div>

    <aside id="sidebar" hidden aria-label="Page thumbnails">
        <p class="sidebar-heading">Pages</p>
        <div class="thumb-size-panel">
            <button class="thumb-reset" id="thumbReset" type="button" title="Reset thumbnail size" aria-label="Reset thumbnail size">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5" y="4" width="14" height="16" rx="1.2"></rect>
                    <path d="M8 8h8M8 11h8M8 14h5"></path>
                </svg>
            </button>
            <div class="thumb-size-controls">
                <button class="thumb-size-step" id="thumbZoomOut" type="button" title="Smaller thumbnails" aria-label="Smaller thumbnails">−</button>
                <input id="thumbSizeRange" type="range" min="60" max="140" step="10" value="100" aria-label="Thumbnail size">
                <button class="thumb-size-step" id="thumbZoomIn" type="button" title="Larger thumbnails" aria-label="Larger thumbnails">+</button>
            </div>
        </div>
        <div id="thumbnailList"></div>
    </aside>

    <div class="popup" id="pageMenu" hidden>
        <div class="menu-section-title">Page Transition</div>
        <button class="menu-option" type="button" data-transition="continuous" aria-pressed="true">
            <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M5 3h14M5 21h14M8 7v10m8-10v10"/><path d="m5 10 3-3 3 3m2 4 3 3 3-3"/></svg></span>
            <span>Continuous Page</span>
        </button>
        <button class="menu-option" type="button" data-transition="page" aria-pressed="false">
            <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg></span>
            <span>Page by Page</span>
        </button>
        <div class="menu-divider"></div>
        <div class="menu-section-title">Page Orientation</div>
        <button class="menu-option" type="button" data-rotate="90">
            <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M8 5H4v4M4 5l5 5"/><path d="M8 8a7 7 0 1 1-2 7"/><path d="M11 8h5v8h-5z"/></svg></span>
            <span>Rotate Clockwise</span>
        </button>
        <button class="menu-option" type="button" data-rotate="-90">
            <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M16 5h4v4m0-4-5 5"/><path d="M16 8a7 7 0 1 0 2 7"/><path d="M8 8h5v8H8z"/></svg></span>
            <span>Rotate Counterclockwise</span>
        </button>
        <div class="menu-divider"></div>
        <div class="menu-section-title">Page Layout</div>
        <button class="menu-option" type="button" data-layout="single" aria-pressed="true">
            <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/></svg></span>
            <span>Single Page</span>
        </button>
        <button class="menu-option" type="button" data-layout="double" aria-pressed="false">
            <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M3 4h8v16H3zM13 4h8v16h-8z"/></svg></span>
            <span>Double Page</span>
        </button>
        <button class="menu-option" type="button" data-layout="cover" aria-pressed="false">
            <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M3 4h8v16H3zM13 4h8v16h-8z"/><path d="M11 4v16"/></svg></span>
            <span>Cover Facing Page</span>
        </button>
    </div>

    <div class="popup" id="zoomMenu" hidden>
        <button class="menu-option" type="button" data-zoom="0.5">50%</button>
        <button class="menu-option" type="button" data-zoom="0.69">69%</button>
        <button class="menu-option" type="button" data-zoom="0.75">75%</button>
        <button class="menu-option" type="button" data-zoom="0.77">77%</button>
        <button class="menu-option" type="button" data-zoom="1">100%</button>
        <button class="menu-option" type="button" data-zoom="1.25">125%</button>
        <button class="menu-option" type="button" data-zoom="1.5">150%</button>
        <button class="menu-option" type="button" data-zoom="2">200%</button>
        <div class="menu-divider"></div>
        <button class="menu-option" type="button" data-fit="width">Fit Width</button>
        <button class="menu-option" type="button" data-fit="page">Fit Page</button>
    </div>

    <div class="popup" id="settingsMenu" hidden>
        <button class="menu-option" type="button" id="toggleFullscreen">
            <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M3 3l7 7M16 3h5v5m0-5-7 7M3 16v5h5m-5 0 7-7m8 7h3v-5m0 5-7-7"/></svg></span>
            <span id="fullscreenLabel">Full screen</span>
        </button>
    </div>

    <iframe id="nativeFallback" title="PDF document native fallback" hidden></iframe>
    <div id="fallbackNote">Enhanced toolbar requires PDF.js from the CDN. Chrome's built-in PDF viewer is shown instead.</div>

    <main id="viewerArea" aria-label="PDF document area">
        <div id="pageStage">
            <div id="loading">Loading document…</div>
        </div>
    </main>
</div>

<script>
(function () {
    "use strict";

    var PDFJS_CSS_UNITS = 96 / 72;
    /* Calibrated so 69% matches the supplied original PDF page size. */
    var PAGE_SCALE_FACTOR = 0.745;

    var params = new URLSearchParams(window.location.search);
    var pdfFile = params.get("pdf");

    var app = document.getElementById("app");
    var toolbar = document.getElementById("toolbar");
    var viewerArea = document.getElementById("viewerArea");
    var pageStage = document.getElementById("pageStage");
    var sidebar = document.getElementById("sidebar");
    var thumbnailList = document.getElementById("thumbnailList");
    var zoomLabel = document.getElementById("zoomLabel");

    var state = {
        pdf: null,
        page: 1,
        zoom: 0.69,
        fitMode: "fixed",
        transition: "continuous",
        layout: "single",
        rotation: 0,
        thumbScale: 1,
        thumbBuildToken: 0,
        renderToken: 0,
        renderTasks: [],
        pan: false,
        dragging: false,
        dragX: 0,
        dragY: 0,
        scrollX: 0,
        scrollY: 0,
        pdfUrl: null,
        intersectionObserver: null
    };

    var menuIds = ["pageMenu", "zoomMenu", "settingsMenu"];

    function closeMenus() {
        menuIds.forEach(function (id) {
            document.getElementById(id).hidden = true;
        });
        document.getElementById("btnPageOptions").setAttribute("aria-expanded", "false");
        document.getElementById("zoomSelect").setAttribute("aria-expanded", "false");
        document.getElementById("btnSettings").setAttribute("aria-expanded", "false");
    }

    function toggleMenu(id, triggerId) {
        var menu = document.getElementById(id);
        var shouldOpen = menu.hidden;
        closeMenus();
        menu.hidden = !shouldOpen;
        document.getElementById(triggerId).setAttribute("aria-expanded", String(shouldOpen));
    }

    function setError(message) {
        pageStage.replaceChildren();
        var node = document.createElement("div");
        node.id = "error";
        node.textContent = message;
        pageStage.appendChild(node);
        reportHeight();
    }

    /* Tell the parent page the exact content height so the outer
       container hugs the certificate (no grey band below it). */
    function reportHeight() {
        var h = toolbar.offsetHeight + pageStage.scrollHeight + 4;
        try {
            parent.postMessage({ __viewerHeight: h }, "*");
        } catch (error) { /* no-op */ }
    }

    function activateNativeFallback(reason) {
        console.warn("PDF.js fallback:", reason);
        if (!state.pdfUrl) {
            setError("No PDF file was specified. Open the document from the local record page.");
            return;
        }
        app.classList.add("native-mode");
        var fallback = document.getElementById("nativeFallback");
        fallback.hidden = false;
        fallback.src = state.pdfUrl;
    }

    function updateZoomLabel() {
        zoomLabel.textContent = Math.round(state.zoom * 100) + "%";
    }

    function updateMenuSelections() {
        document.querySelectorAll("[data-transition]").forEach(function (button) {
            button.setAttribute("aria-pressed", String(button.dataset.transition === state.transition));
        });
        document.querySelectorAll("[data-layout]").forEach(function (button) {
            button.setAttribute("aria-pressed", String(button.dataset.layout === state.layout));
        });
    }

    function updateLayoutAvailability() {
        /* Double-page layouts cannot meaningfully display a one-page document.
           Match the reference viewer by disabling those choices in that case. */
        var singlePageDocument = !state.pdf || state.pdf.numPages < 2;
        document.querySelectorAll('[data-layout="double"], [data-layout="cover"]').forEach(function (button) {
            button.disabled = singlePageDocument;
            button.title = singlePageDocument
                ? "Unavailable for a one-page document"
                : button.textContent.trim();
        });
        if (singlePageDocument && state.layout !== "single") {
            state.layout = "single";
        }
        updateMenuSelections();
    }

    function updateActiveThumbnail() {
        document.querySelectorAll(".thumb-item").forEach(function (button) {
            if (Number(button.dataset.page) === state.page) {
                button.setAttribute("aria-current", "page");
            } else {
                button.removeAttribute("aria-current");
            }
        });
    }

    function normalizedRotation(value) {
        return ((value % 360) + 360) % 360;
    }

    function cancelRenderTasks() {
        state.renderTasks.forEach(function (task) {
            try { task.cancel(); } catch (error) { /* no-op */ }
        });
        state.renderTasks = [];
    }

    function calculateRenderScale(baseViewport) {
        var availableWidth = Math.max(180, viewerArea.clientWidth - 28);
        var availableHeight = Math.max(180, viewerArea.clientHeight - 20);
        var targetScale = state.zoom * PDFJS_CSS_UNITS * PAGE_SCALE_FACTOR;

        if (state.layout === "double" || state.layout === "cover") {
            availableWidth = Math.max(180, (availableWidth - 16) / 2);
        }

        if (state.fitMode === "width") {
            targetScale = availableWidth / baseViewport.width;
            state.zoom = targetScale / (PDFJS_CSS_UNITS * PAGE_SCALE_FACTOR);
        } else if (state.fitMode === "page") {
            targetScale = Math.min(
                availableWidth / baseViewport.width,
                availableHeight / baseViewport.height
            );
            state.zoom = targetScale / (PDFJS_CSS_UNITS * PAGE_SCALE_FACTOR);
        }

        updateZoomLabel();
        return targetScale;
    }

    async function renderDocument(options) {
        options = options || {};
        if (!state.pdf) return;

        var token = ++state.renderToken;
        cancelRenderTasks();

        if (state.intersectionObserver) {
            state.intersectionObserver.disconnect();
            state.intersectionObserver = null;
        }

        pageStage.replaceChildren();
        pageStage.className = "layout-" + state.layout;

        var pageNumbers = [];
        if (state.transition === "page") {
            pageNumbers = [state.page];
        } else {
            for (var number = 1; number <= state.pdf.numPages; number++) {
                pageNumbers.push(number);
            }
        }

        try {
            var firstPage = await state.pdf.getPage(pageNumbers[0] || 1);
            if (token !== state.renderToken) return;
            var firstBaseViewport = firstPage.getViewport({
                scale: 1,
                rotation: normalizedRotation(firstPage.rotate + state.rotation)
            });
            var renderScale = calculateRenderScale(firstBaseViewport);
            var dpr = Math.max(1, window.devicePixelRatio || 1);

            for (var i = 0; i < pageNumbers.length; i++) {
                if (token !== state.renderToken) return;

                var pageNumber = pageNumbers[i];
                var page = (pageNumber === (pageNumbers[0] || 1))
                    ? firstPage
                    : await state.pdf.getPage(pageNumber);

                if (token !== state.renderToken) return;

                var rotation = normalizedRotation(page.rotate + state.rotation);
                var viewport = page.getViewport({
                    scale: renderScale * dpr,
                    rotation: rotation
                });

                var shell = document.createElement("section");
                shell.className = "pdf-page-shell";
                shell.id = "pdf-page-" + pageNumber;
                shell.dataset.page = String(pageNumber);
                shell.setAttribute("aria-label", "Page " + pageNumber);

                var canvas = document.createElement("canvas");
                canvas.className = "pdf-page";
                canvas.width = Math.ceil(viewport.width);
                canvas.height = Math.ceil(viewport.height);
                canvas.style.width = Math.floor(viewport.width / dpr) + "px";
                canvas.style.height = Math.floor(viewport.height / dpr) + "px";

                var context = canvas.getContext("2d", { alpha: false });
                if (!context) throw new Error("Could not create the PDF canvas.");

                shell.appendChild(canvas);

                if (state.layout !== "single") {
                    var pageNo = document.createElement("div");
                    pageNo.className = "page-number";
                    pageNo.textContent = String(pageNumber);
                    shell.appendChild(pageNo);
                }

                pageStage.appendChild(shell);

                var task = page.render({
                    canvasContext: context,
                    viewport: viewport
                });
                state.renderTasks.push(task);

                try {
                    await task.promise;
                } catch (renderError) {
                    if (renderError && renderError.name === "RenderingCancelledException") return;
                    throw renderError;
                }
            }

            if (token !== state.renderToken) return;

            updateActiveThumbnail();

            if (state.transition === "continuous") {
                state.intersectionObserver = new IntersectionObserver(function (entries) {
                    var mostVisible = entries
                        .filter(function (entry) { return entry.isIntersecting; })
                        .sort(function (a, b) { return b.intersectionRatio - a.intersectionRatio; })[0];

                    if (mostVisible) {
                        state.page = Number(mostVisible.target.dataset.page) || state.page;
                        updateActiveThumbnail();
                    }
                }, {
                    root: viewerArea,
                    threshold: [0.25, 0.5, 0.75]
                });

                pageStage.querySelectorAll(".pdf-page-shell").forEach(function (shell) {
                    state.intersectionObserver.observe(shell);
                });
            }

            if (options.scrollToCurrent && state.transition === "continuous") {
                var target = document.getElementById("pdf-page-" + state.page);
                if (target) target.scrollIntoView({ block: "start", behavior: "auto" });
            } else if (!options.preserveScroll) {
                viewerArea.scrollTop = 0;
                viewerArea.scrollLeft = 0;
            }

            reportHeight();
        } catch (error) {
            if (error && error.name === "RenderingCancelledException") return;
            console.error("PDF rendering failed:", error);
            setError("The PDF could not be rendered. Check the local PDF file and the PDF.js connection.");
        }
    }

    async function buildThumbnails() {
        if (!state.pdf) return;
        var buildToken = ++state.thumbBuildToken;
        thumbnailList.replaceChildren();

        for (var pageNumber = 1; pageNumber <= state.pdf.numPages; pageNumber++) {
            var currentPageNumber = pageNumber;
            var page = await state.pdf.getPage(pageNumber);
            if (buildToken !== state.thumbBuildToken) return;

            var button = document.createElement("button");
            button.type = "button";
            button.className = "thumb-item";
            button.dataset.page = String(pageNumber);
            button.setAttribute("aria-label", "Go to page " + pageNumber);

            var viewportAtOne = page.getViewport({
                scale: 1,
                rotation: normalizedRotation(page.rotate + state.rotation)
            });
            var thumbScale = Math.min(
                (78 * state.thumbScale) / viewportAtOne.width,
                (112 * state.thumbScale) / viewportAtOne.height
            );
            var viewport = page.getViewport({
                scale: thumbScale,
                rotation: normalizedRotation(page.rotate + state.rotation)
            });

            var canvas = document.createElement("canvas");
            canvas.className = "thumb-canvas";
            canvas.width = Math.ceil(viewport.width);
            canvas.height = Math.ceil(viewport.height);
            canvas.style.width = Math.floor(viewport.width) + "px";
            canvas.style.height = Math.floor(viewport.height) + "px";
            button.appendChild(canvas);

            var label = document.createElement("span");
            label.className = "thumb-label";
            label.textContent = String(pageNumber);
            button.appendChild(label);

            button.addEventListener("click", function () {
                state.page = Number(this.dataset.page) || 1;
                updateActiveThumbnail();
                closeMenus();

                if (state.transition === "page") {
                    renderDocument();
                } else {
                    var pageShell = document.getElementById("pdf-page-" + state.page);
                    if (pageShell) pageShell.scrollIntoView({ block: "start", behavior: "smooth" });
                }
            });

            thumbnailList.appendChild(button);

            try {
                await page.render({
                    canvasContext: canvas.getContext("2d"),
                    viewport: viewport
                }).promise;
            } catch (error) {
                if (error && error.name === "RenderingCancelledException") return;
                console.warn("Thumbnail render skipped for page", currentPageNumber, error);
            }
            if (buildToken !== state.thumbBuildToken) return;
        }

        updateActiveThumbnail();
    }

    function setZoom(value) {
        state.zoom = Math.max(0.25, Math.min(4, Number(value) || 0.69));
        state.fitMode = "fixed";
        closeMenus();
        renderDocument({ preserveScroll: true });
    }

    function applyFit(mode) {
        state.fitMode = mode;
        closeMenus();
        renderDocument({ preserveScroll: false });
    }

    async function rotatePage(delta) {
        state.rotation = normalizedRotation(state.rotation + delta);
        closeMenus();
        await renderDocument({ preserveScroll: true });
        await buildThumbnails();
    }

    function setTransition(value) {
        if (value !== "continuous" && value !== "page") return;
        state.transition = value;
        state.page = Math.min(Math.max(1, state.page), state.pdf ? state.pdf.numPages : 1);
        updateMenuSelections();
        closeMenus();
        renderDocument({ preserveScroll: false });
    }

    function setLayout(value) {
        if (!["single", "double", "cover"].includes(value)) return;
        if (state.pdf && state.pdf.numPages < 2 && value !== "single") return;
        state.layout = value;
        state.fitMode = state.fitMode === "fixed" ? "fixed" : state.fitMode;
        updateMenuSelections();
        closeMenus();
        renderDocument({ preserveScroll: true });
    }

    function toggleFullscreen() {
        var label = document.getElementById("fullscreenLabel");
        var fn = document.fullscreenElement
            ? document.exitFullscreen
            : app.requestFullscreen;

        if (document.fullscreenElement) {
            fn.call(document).catch(function (error) {
                console.warn("Could not exit fullscreen:", error);
            });
        } else if (typeof app.requestFullscreen === "function") {
            app.requestFullscreen().catch(function (error) {
                console.warn("Fullscreen is unavailable:", error);
            });
        } else {
            setError("Full screen is not supported by this browser.");
            return;
        }

        closeMenus();
    }

    document.addEventListener("fullscreenchange", function () {
        var label = document.getElementById("fullscreenLabel");
        if (label) {
            label.textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
        }
    });

    document.getElementById("btnSidebar").addEventListener("click", function () {
        var willOpen = sidebar.hidden;
        sidebar.hidden = !willOpen;
        app.classList.toggle("sidebar-open", willOpen);
        this.setAttribute("aria-pressed", String(willOpen));
        if (state.fitMode !== "fixed") renderDocument({ preserveScroll: true });
    });

    function setThumbnailScale(value) {
        state.thumbScale = Math.max(0.6, Math.min(1.4, Number(value) || 1));
        document.getElementById("thumbSizeRange").value = String(Math.round(state.thumbScale * 100));
        buildThumbnails();
    }

    document.getElementById("thumbSizeRange").addEventListener("input", function () {
        setThumbnailScale(Number(this.value) / 100);
    });
    document.getElementById("thumbZoomOut").addEventListener("click", function () {
        setThumbnailScale(state.thumbScale - 0.1);
    });
    document.getElementById("thumbZoomIn").addEventListener("click", function () {
        setThumbnailScale(state.thumbScale + 0.1);
    });
    document.getElementById("thumbReset").addEventListener("click", function () {
        setThumbnailScale(1);
    });

    document.getElementById("btnPageOptions").addEventListener("click", function () {
        toggleMenu("pageMenu", "btnPageOptions");
    });
    document.getElementById("zoomSelect").addEventListener("click", function () {
        toggleMenu("zoomMenu", "zoomSelect");
    });
    document.getElementById("btnSettings").addEventListener("click", function () {
        toggleMenu("settingsMenu", "btnSettings");
    });
    document.getElementById("toggleFullscreen").addEventListener("click", toggleFullscreen);

    document.getElementById("zoomOut").addEventListener("click", function () {
        setZoom(state.zoom / 1.1);
    });
    document.getElementById("zoomIn").addEventListener("click", function () {
        setZoom(state.zoom * 1.1);
    });

    document.querySelectorAll("[data-zoom]").forEach(function (button) {
        button.addEventListener("click", function () {
            setZoom(this.dataset.zoom);
        });
    });
    document.querySelectorAll("[data-fit]").forEach(function (button) {
        button.addEventListener("click", function () {
            applyFit(this.dataset.fit);
        });
    });
    document.querySelectorAll("[data-transition]").forEach(function (button) {
        button.addEventListener("click", function () {
            setTransition(this.dataset.transition);
        });
    });
    document.querySelectorAll("[data-rotate]").forEach(function (button) {
        button.addEventListener("click", function () {
            rotatePage(Number(this.dataset.rotate));
        });
    });
    document.querySelectorAll("[data-layout]").forEach(function (button) {
        button.addEventListener("click", function () {
            setLayout(this.dataset.layout);
        });
    });

    document.getElementById("btnPan").addEventListener("click", function () {
        state.pan = !state.pan;
        this.setAttribute("aria-pressed", String(state.pan));
        app.classList.toggle("pan-mode", state.pan);
    });

    viewerArea.addEventListener("pointerdown", function (event) {
        if (!state.pan || event.button !== 0) return;
        state.dragging = true;
        state.dragX = event.clientX;
        state.dragY = event.clientY;
        state.scrollX = viewerArea.scrollLeft;
        state.scrollY = viewerArea.scrollTop;
        app.classList.add("is-dragging");
        try { viewerArea.setPointerCapture(event.pointerId); } catch (error) { /* no-op */ }
        event.preventDefault();
    });
    viewerArea.addEventListener("pointermove", function (event) {
        if (!state.dragging) return;
        viewerArea.scrollLeft = state.scrollX - (event.clientX - state.dragX);
        viewerArea.scrollTop = state.scrollY - (event.clientY - state.dragY);
    });
    function endPan() {
        state.dragging = false;
        app.classList.remove("is-dragging");
    }
    viewerArea.addEventListener("pointerup", endPan);
    viewerArea.addEventListener("pointercancel", endPan);
    window.addEventListener("pointerup", endPan);

    document.addEventListener("click", function (event) {
        if (!event.target.closest("#toolbar") && !event.target.closest(".popup")) closeMenus();
    });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeMenus();
        if (state.transition === "page" && !event.altKey && !event.ctrlKey && !event.metaKey) {
            if (event.key === "ArrowRight" || event.key === "ArrowDown") {
                if (state.pdf && state.page < state.pdf.numPages) {
                    state.page++;
                    renderDocument();
                    updateActiveThumbnail();
                }
            } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
                if (state.pdf && state.page > 1) {
                    state.page--;
                    renderDocument();
                    updateActiveThumbnail();
                }
            }
        }
    });

    window.addEventListener("resize", function () {
        if (state.pdf && state.fitMode !== "fixed") renderDocument({ preserveScroll: true });
        reportHeight();
    });

    if (!pdfFile) {
        setError("No PDF file was specified. Open this viewer from the local record page.");
        return;
    }

    state.pdfUrl = new URL("../" + pdfFile.replace(/^\/+/, ""), window.location.href).href;

    if (typeof pdfjsLib === "undefined") {
        activateNativeFallback("The PDF.js library could not be loaded from its CDN.");
        return;
    }

    try {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "../assets/js/pdf.worker.min.js";

        pdfjsLib.getDocument({ url: state.pdfUrl }).promise.then(async function (pdf) {
            state.pdf = pdf;
            state.page = 1;

            var loading = document.getElementById("loading");
            if (loading) loading.remove();

            updateLayoutAvailability();
            await renderDocument();
            await buildThumbnails();
            updateMenuSelections();
            reportHeight();
        }).catch(function (error) {
            console.error("PDF loading failed:", error);
            activateNativeFallback("PDF.js could not load the local PDF.");
        });
    } catch (error) {
        console.error("PDF.js initialisation failed:", error);
        activateNativeFallback("PDF.js initialisation failed.");
    }
})();
</script>
</body>
</html>
