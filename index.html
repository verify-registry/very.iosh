    <button id="scrollTopBtn" type="button" title="Back to top" aria-label="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 19V6M6 12l6-6 6 6" fill="none" stroke="#fff"
                  stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <script src="data/students.js"></script>

    <script>
    /* The inner viewer reports its real content height; the container
       hugs it exactly so no grey band remains below the certificate. */
    window.addEventListener("message", function (event) {
        var data = event.data;
        if (data && typeof data.__viewerHeight === "number") {
            var container = document.getElementById("documentViewerContainer");
            if (container) {
                container.style.height = Math.max(320, Math.round(data.__viewerHeight)) + "px";
            }
        }
    });

    document.addEventListener("DOMContentLoaded", function () {
        var params = new URLSearchParams(window.location.search);
        var ref = (params.get("reference") || params.get("ref") || "").trim();
        var frame = document.getElementById("documentViewerFrame");

        if (!ref) {
            showAlert(
                "warning",
                "No reference number provided. Please use a valid record link like: " +
                "<code>?reference=93548623-01-MYX8</code>"
            );
            return;
        }

        /* Defensive lookup: tolerates accidental stray spaces in data keys. */
        var studentsMap = window.STUDENTS || {};
        var student = null;
        for (var key in studentsMap) {
            if (Object.prototype.hasOwnProperty.call(studentsMap, key) && key.trim() === ref) {
                student = studentsMap[key];
                break;
            }
        }

        if (!student) {
            showAlert(
                "danger",
                "No local record found for reference: <strong>" + esc(ref) + "</strong>"
            );
            return;
        }

        if (student.status === "valid") {
            var message =
                "This document is valid and was issued by IOSH (Institution of Occupational Safety and Health) to " +
                esc((student.name || "").trim()) +
                " on " +
                formatIssueDate(student.issueDate);

            showAlert("success", message);
        } else {
            showAlert(
                "danger",
                "This local record is not marked as valid. " +
                "Confirm its status through the official issuing organization."
            );
            return;
        }

        if (student.pdf) {
            frame.src =
                "pages/viewer.html?pdf=" + encodeURIComponent((student.pdf || "").trim()) + "&v=20261102";
        }

        initScrollTop();
    });

    /* Render the date exactly as the reference page renders it in an LTR
       sentence (same bidi outcome), without reordering anything by hand. */
    function formatIssueDate(value) {
        var raw = String(value == null ? "" : value).trim();
        return esc(raw);
    }

    function initScrollTop() {
        var btn = document.getElementById("scrollTopBtn");
        function sync() {
            var show = window.scrollY > 300;
            btn.classList.toggle("is-visible", show);
            btn.style.opacity = show ? "1" : "0";
            btn.style.visibility = show ? "visible" : "hidden";
        }
        window.addEventListener("scroll", sync, { passive: true });
        btn.addEventListener("click", function () {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
        sync();
    }

    function showAlert(type, html) {
        var box = document.getElementById("verificationAlert");

        var icons = {
            info:
                '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' +
                '<circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.2"/>' +
                '<path d="M12 10v7M12 7h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' +
                '</svg>',

            /* Circled check — calibrated exactly to match original verification mark */
            success:
                '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' +
                '<circle cx="12" cy="12" r="9.5" fill="none" stroke="#fff" stroke-width="2.2"/>' +
                '<path d="m8 12.5 2.8 2.8 5.2-5.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
                '</svg>',

            warning:
                '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' +
                '<path d="M12 3 22 21H2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>' +
                '<path d="M12 9v5m0 3h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
                '</svg>',

            danger:
                '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' +
                '<circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>' +
                '<path d="m8.5 8.5 7 7m0-7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
                '</svg>'
        };

        box.className = "alert alert-" + type;

        box.innerHTML =
            '<div class="alert-icon">' +
            (icons[type] || icons.info) +
            '</div>' +
            '<div class="alert-text">' + html + '</div>';
    }

    function esc(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[c];
        });
    }
    </script>
